<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Admission Form - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
    <img src="images/GCET logo.png" alt="GCET Logo" style="height: 48px; width: auto;">
    <div class="title-text">
                <h1>Govt. College of Engineering and Technology, Jammu</h1>
                <p>(Autonomous College)</p>
            </div>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Search...">
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="#">Academics</a></li>
            <li><a href="admission.html" class="active">Admissions</a></li>
            <li><a href="dashboard.html">Students</a></li>
            <li><a href="faculty.html">Faculty</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="#">Contact</a></li>
            <li class="login-nav-btn"><a href="login.html">Student Login</a></li>
        </ul>
    </nav>

    <main class="main-content" style="max-width: 800px; margin: 20px auto;">
        <div class="card-panel">
            <h2 style="color: var(--primary-red); text-align: center; margin-bottom: 25px;">Student Admission Form</h2>
            
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth *</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Course Applied For *</label>
                        <select id="course" name="course" required>
                            <option value="">- Select Course -</option>
                            <option value="CSE">B.Tech - Computer Science & Engineering</option>
                            <option value="ECE">B.Tech - Electronics & Communication</option>
                            <option value="EE">B.Tech - Electrical Engineering</option>
                            <option value="ME">B.Tech - Mechanical Engineering</option>
                            <option value="CE">B.Tech - Civil Engineering</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mobile">Mobile Number *</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter contact number" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" placeholder="Enter your address" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gender *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" required> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-btn">Submit</button>
                    <button type="reset" class="btn-secondary">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GCET Jammu. All Rights Reserved.</p>
    </footer>

</body>
</html>
